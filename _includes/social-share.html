{% include base_path %}

<section class="page__share">
  {% if site.data.ui-text[site.active_lang].share_on_label %}
    <h4 class="page__share-title">{{ site.data.ui-text[site.active_lang].share_on_label | default: "Share on" }}</h4>
  {% endif %}

  <a href="https://mastodon.social/share?text={{ base_path }}{{ page.url }}" target="_blank" class="btn btn--mastodon" title="{{ site.data.ui-text[site.active_lang].share_on_label | default: 'Share on' }} Mastodon"><i class="fab fa-mastodon" aria-hidden="true"></i><span> Mastodon</span></a>

  <a href="https://www.reddit.com/submit?url={{ base_path }}{{ page.url }}" target="_blank" class="btn btn--reddit" title="{{ site.data.ui-text[site.active_lang].share_on_label | default: 'Share on' }} Reddit"><i class="fab fa-reddit" aria-hidden="true"></i><span> Reddit</span></a>

  <a href="https://bsky.app/intent/compose?text={{ base_path }}{{ page.url }}" target="_blank" class="btn btn--bluesky" title="{{ site.data.ui-text[site.active_lang].share_on_label | default: 'Share on' }} Bluesky"><i class="fab fa-bluesky" aria-hidden="true"></i><span> Bluesky</span></a>

  <a href="https://www.linkedin.com/shareArticle?mini=true&url={{ base_path }}{{ page.url }}" target="_blank" class="btn btn--linkedin" title="{{ site.data.ui-text[site.active_lang].share_on_label | default: 'Share on' }} LinkedIn"><i class="fab fa-linkedin" aria-hidden="true"></i><span> LinkedIn</span></a>
</section>
